# SPDX-License-Identifier: MPL-2.0
name: Candidate checks
on:
  push:
    branches: ['dev/release-prep-01']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact candidate source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Source SHA mismatch' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test interpreter
        run: python -m pip install lupa==2.8
      - name: Lua 5.4 regression and lifecycle
        run: python tools/test.py
      - name: Package and verify immutable source-only candidate
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: MagicalScabbards-candidate-${{ github.sha }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error
