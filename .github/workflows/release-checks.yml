# SPDX-License-Identifier: MPL-2.0
name: Verify v0.1.0 source
on:
  push:
    branches: ['release/v0.1.0']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Source SHA mismatch' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.4 test engine
        run: python -m pip install lupa==2.8
      - name: Run full Lua regression suites
        run: python tools/test.py
      - name: Test deterministic package (not distributed)
        run: python tools/package.py
      - name: Assert stable manifest
        shell: pwsh
        run: |
          $m = Get-Content dist/MagicalScabbards-0.1.0.manifest.json -Raw | ConvertFrom-Json
          if ($m.version -ne '0.1.0' -or $m.acceptance -ne 'ACCEPTED' -or $m.source_commit -ne '${{ github.sha }}') { throw 'Stable identity mismatch' }
